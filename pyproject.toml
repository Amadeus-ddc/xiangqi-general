[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-general"
version = "0.2.0"
description = "Reproducible Xiangqi adaptation of Queen's expert-language-model research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "pyffish==0.0.90", "protobuf>=4.25,<8"]

[project.optional-dependencies]
train = ["transformers>=4.56,<6", "peft>=0.17,<1", "huggingface-hub>=0.34,<2", "requests>=2.31,<3"]
teacher = ["transformers>=5.8.1,<6", "accelerate>=1.4,<2", "safetensors>=0.6,<1", "huggingface-hub>=0.34,<2"]
reference = ["onnx>=1.16,<2", "onnxruntime==1.23.2"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
xqgeneral-ask = "xqgeneral.ask:main"
xqgeneral-train = "xqgeneral.train:main"
xqgeneral-data = "xqgeneral.data:main"
xqgeneral-coach = "xqgeneral.coach:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
